name: line-test
# LINE通知の設定確認用。手動で実行すると、テストのメッセージを1通送る。
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m collector.notify_line "オートレースAIオフィスからのテスト通知です。この後、締切3分前に推奨があるレースを送ります。"
