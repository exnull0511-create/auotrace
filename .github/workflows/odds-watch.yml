name: odds-watch
# 締切前オッズの時系列を記録。1回の実行で約5時間動き続け、10分ごとに data ブランチへ保存。
# 夜も止めずに待機し、1回終わるときは締切直前のレースが無い瞬間を選んで、自分で次の回を起動する（24時間途切れない）。
# GitHub の予約実行は30分〜1時間半遅れたり飛ばされたりするので、下の予約は止まってしまったときの予備。
# 同時に動くのは1つだけ（待ちは1つまで）。コードを更新したら手動で起動すれば、今の回が区切りのよい瞬間に終わって引き継ぐ。
# 監視中は見張り係（health）も30分ごとに起こす。
on:
  schedule:
    - cron: "23 0 * * *"    # 9:23 JST
    - cron: "41 0 * * *"    # 9:41 JST
    - cron: "7 1 * * *"     # 10:07 JST
    - cron: "17 6 * * *"    # 15:17 JST（自分で次を起動できなかったときの保険）
    - cron: "17 11 * * *"   # 20:17 JST（同上）
  workflow_dispatch:
    inputs:
      minutes:
        description: "何分動かすか"
        default: "295"

permissions:
  contents: write
  actions: write

concurrency:
  group: odds-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      # 締切前のオッズが締切後に大きく崩れることがあるため、12/9の検証が済むまで通知を停止中（on で再開）
      LINE_NOTIFY: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r collector/requirements.txt
      - run: bash tools/data_branch.sh checkout
      - run: python -m collector.odds_watch --data data --minutes ${{ inputs.minutes || '295' }}
